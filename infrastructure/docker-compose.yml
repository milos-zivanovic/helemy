version: '3.8'

services:
  # Development with SQLite (default)
  api-dev:
    build:
      context: ..
      dockerfile: api/Dockerfile
#    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../api:/app
      - ./data:/app/data
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=sqlite:///data/db.sqlite3
      - DJANGO_SETTINGS_MODULE=life_tracker.settings
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081,http://127.0.0.1:8081
    profiles:
      - dev

  # Development with PostgreSQL
  api-dev-pg:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../api:/app
    ports:
      - "8001:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/life_tracker
      - DJANGO_SETTINGS_MODULE=life_tracker.settings
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081,http://127.0.0.1:8081
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - dev-pg

  # PostgreSQL database
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=life_tracker
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - dev-pg
      - prod

  # Production API
  api-prod:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: gunicorn life_tracker.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ../api:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    environment:
      - DEBUG=0
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/life_tracker
      - DJANGO_SETTINGS_MODULE=life_tracker.settings
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - prod

volumes:
  postgres_data:
  media_files:
  static_files:
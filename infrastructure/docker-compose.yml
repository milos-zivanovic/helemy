# Helemy services. Run from this folder, always with a profile:
#   docker compose --profile dev up -d --build      web -> http://localhost:3000, API (SQLite) -> http://localhost:8000
#   docker compose --profile dev-pg up -d --build   web -> http://localhost:3000, API (PostgreSQL) -> http://localhost:8001
#   docker compose --profile prod up -d --build     web + API behind nginx -> http://localhost:8080, needs infrastructure/.env
# See infrastructure/README.md.

x-api-build: &api-build
  context: ../api

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

x-api-dev-env: &api-dev-env
  DEBUG: "1"
  SECRET_KEY: dev-secret-key-change-in-production
  ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,api-dev,api-dev-pg
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081,http://127.0.0.1:8081
  DJANGO_MIGRATE: "1"   # entrypoint runs `migrate` on every start

services:
  # Development with SQLite (default)
  api-dev:
    build: *api-build
    image: helemy-api:dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../api:/app          # live code reload
      - ./data:/app/data     # SQLite file lives in infrastructure/data/
    ports:
      - "8000:8000"
    environment:
      <<: *api-dev-env
      DATABASE_URL: sqlite:///data/db.sqlite3
    healthcheck: *api-healthcheck
    profiles:
      - dev

  # Web dev server (Vite) for the dev profile; the browser calls the API on localhost:8000.
  web-dev: &web-dev
    build:
      context: ../web
      target: dev
    image: helemy-web:dev
    volumes:
      - ../web:/app          # live code reload
      - /app/node_modules    # keep the image's Linux node_modules, don't use the host's
    ports:
      - "3000:3000"
    environment:
      WATCH_POLLING: "1"     # file changes on a Windows bind mount need polling
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles:
      - dev

  # Development with PostgreSQL
  api-dev-pg:
    build: *api-build
    image: helemy-api:dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../api:/app
    ports:
      - "8001:8000"
    environment:
      <<: *api-dev-env
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/helemy
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *api-healthcheck
    profiles:
      - dev-pg

  # Web dev server for the dev-pg profile: same as web-dev, but the browser calls api-dev-pg
  # (localhost:8001). Uses port 3000 too, so don't run the dev and dev-pg profiles together.
  web-dev-pg:
    <<: *web-dev
    environment:
      WATCH_POLLING: "1"
      VITE_API_URL: http://localhost:8001
    profiles:
      - dev-pg

  # PostgreSQL database (dev-pg and prod)
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: helemy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helemy"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - dev-pg
      - prod

  # Production-like API: code baked into the image, gunicorn, DEBUG off.
  # Required variables come from infrastructure/.env (see infrastructure/README.md).
  api-prod:
    build: *api-build
    image: helemy-api:prod
    volumes:
      - media_files:/app/media
    ports:
      - "8002:8000"
    environment:
      DEBUG: "0"
      # Empty SECRET_KEY makes Django refuse to start (":?" can't be used: Compose checks it for every profile)
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      EMAIL_URL: ${EMAIL_URL:-consolemail://}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Helemy <noreply@localhost>}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:8080/reset-password?uid={uid}&token={token}}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/helemy
      DJANGO_MIGRATE: "1"
      NUM_PROXIES: "1"  # web-prod's nginx in front (X-Forwarded-For), as Google's front end on Cloud Run
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *api-healthcheck
    restart: unless-stopped
    profiles:
      - prod

  # Production web: the built app served by nginx, which also forwards /api, /admin, /static and
  # /media to api-prod. The one public entry point of the prod profile.
  web-prod:
    build:
      context: ../web
      target: prod
    image: helemy-web:prod
    ports:
      - "8080:80"
    depends_on:
      api-prod:
        condition: service_healthy  # nginx needs the api-prod host name to exist when it starts
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - prod

volumes:
  postgres_data:
  media_files:

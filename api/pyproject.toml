[build-system]
# hatchling builds in a temp dir, so `pip install .` leaves no build/ or *.egg-info behind.
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "api"
version = "0.1.0"
description = "Personal finance, fitness, and nutrition tracking API"
readme = "README.md"
authors = [{name = "Milos Zivanovic", email = "z.milos93@yahoo.com"}]
license = {text = "Proprietary"}  # all rights reserved, see ../LICENSE
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.19",  # LTS, supported until April 2028
    "djangorestframework==3.18.3",
    "djangorestframework-simplejwt==5.5.1",
    "django-filter==26.2",
    "drf-spectacular==0.30.0",
    "django-cors-headers==4.9.0",
    "django-environ==0.14.0",
    "psycopg2-binary==2.9.13",
    "Pillow==13.0.0",
    "gunicorn==27.0.1",
    "whitenoise==6.12.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.4.4",
    "coverage==7.17.3",
]

# Not a library: `pip install .` installs only the dependencies, no code is packaged.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "*/migrations/*",  # generated by Django
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by ruff format)
    "B008",  # function calls in default arguments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Tests run with Django's runner. Coverage, from api/:
#   ../.venv/Scripts/python.exe -m coverage run manage.py test && ../.venv/Scripts/python.exe -m coverage report
[tool.coverage.run]
source = ["life_tracker", "users", "finances", "fitness", "nutrition", "common"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*_test.py",
    "manage.py",
    "life_tracker/wsgi.py",
    "life_tracker/asgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
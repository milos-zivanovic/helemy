[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "life-tracker"
version = "0.1.0"
description = "Personal finance, fitness, and nutrition tracking API"
readme = "README.md"
authors = [{name = "Milos Zivanovic", email = "z.milos93@yahoo.com"}]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "Django==5.0.7",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.3.1",
    "django-filter==24.3",
    "drf-spectacular==0.27.2",
    "django-cors-headers==4.4.0",
    "django-environ==0.11.2",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "black==24.4.2",
    "ruff==0.4.4",
    "pytest==8.2.0",
    "pytest-django==4.8.0",
    "pytest-cov==5.0.0",
    "factory-boy==3.3.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in default arguments
]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "life_tracker.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config -v"

[tool.coverage.run]
source = ["life_tracker", "users", "finances", "fitness", "nutrition", "common"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*_test.py",
    "manage.py",
    "life_tracker/wsgi.py",
    "life_tracker/asgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
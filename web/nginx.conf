# nginx for the web-prod container: the built app plus a reverse proxy to the API, so the browser sees
# one origin (no CORS) and the API container isn't exposed directly.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API, Django admin and its static/media files go to the API container (gunicorn).
    location ~ ^/(api|admin|static|media)/ {
        proxy_pass http://api-prod:8000;
        # Keep the browser's host:port, so Django's ALLOWED_HOSTS and CSRF origin checks see the real one.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Vite puts a content hash in every file name under /assets/, so they can be cached forever:
    # a new build has new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app: an unknown path (/finances/reports) gets index.html
    # and React Router picks the page. index.html itself is never cached, so a new build shows up
    # on the next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
